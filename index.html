<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Keyboard Assets Generator</title>
  <link rel="stylesheet" href="./styles.css?v=20260828-9" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><h1>Keyboard Assets Generator</h1></div>
      <div class="top-actions">
        <button id="resetView" class="ghost">Reset view</button>
        <button id="savePreset" class="ghost">Save preset</button>
        <label class="ghost file-button">Load preset<input id="loadPreset" type="file" accept="application/json" /></label>
      </div>
    </header>

    <section class="workspace">
      <aside class="panel controls" id="controls">
        <details open>
          <summary>Range</summary>
          <div class="grid two">
            <label>From<input id="rangeFrom" value="C2" /></label>
            <label>To<input id="rangeTo" value="C5" /></label>
          </div>
          <div class="preset-row">
            <button data-low="B1">Low B</button><button data-low="E1">Low E</button><button data-high="C5">High C</button><button data-high="F5">High F</button>
          </div>
          <label class="check"><input id="showLabels" type="checkbox" /> Show note labels</label>
        </details>

        <details open>
          <summary>Key geometry</summary>
<label>Size preset<select id="sizePreset"><option value="custom">Custom</option><option value="piano">Piano standard</option><option value="cz101">CZ-101 mini</option><option value="microkorg">microKORG mini</option></select></label>
          <label>White width<div class="slider-number"><input type="range" data-sync="whiteWidth" min="8" max="120" step="1" value="48" /><input id="whiteWidth" type="number" min="8" max="200" step="1" value="48" /></div></label>
          <label>White length<div class="slider-number"><input type="range" data-sync="whiteLength" min="40" max="400" step="1" value="188" /><input id="whiteLength" type="number" min="20" max="600" step="1" value="188" /></div></label>
          <label>White thickness<div class="slider-number"><input type="range" data-sync="whiteThickness" min="1" max="30" step="1" value="10" /><input id="whiteThickness" type="number" min="1" max="50" step="1" value="10" /></div></label>
          <label>Front radius<div class="slider-number"><input type="range" data-sync="frontRadius" min="0" max="12" step="0.5" value="3" /><input id="frontRadius" type="number" min="0" max="12" step="0.5" value="3" /></div></label>
          <label>Black width<div class="slider-number"><input type="range" data-sync="blackWidth" min="6" max="60" step="1" value="23" /><input id="blackWidth" type="number" min="4" max="120" step="1" value="23" /></div></label>
          <label>Black length<div class="slider-number"><input type="range" data-sync="blackLength" min="20" max="220" step="1" value="95" /><input id="blackLength" type="number" min="10" max="400" step="1" value="95" /></div></label>
          <label>Black height<div class="slider-number"><input type="range" data-sync="blackHeight" min="2" max="40" step="1" value="12" /><input id="blackHeight" type="number" min="2" max="80" step="1" value="12" /></div></label>
          <label>Key gap<div class="slider-number"><input type="range" data-sync="keyGap" min="0" max="5" step="0.1" value="3" /><input id="keyGap" type="number" min="0" max="5" step="0.1" value="3" /></div></label>
          <label>Pressed angle <span id="pressAngleOut">6°</span><div class="slider-number"><input id="pressAngle" type="range" min="0" max="18" step="0.25" value="6" /><input type="number" data-range-sync="pressAngle" min="0" max="18" step="0.25" value="6" /></div></label>
        </details>

        <details open>
          <summary>Materials</summary>
          <label>Render quality<select id="renderQuality"><option value="asset">Asset</option><option value="studio" selected>Studio</option><option value="product">Product</option></select></label>
          <label class="check"><input id="wireframe" type="checkbox" /> Wireframe preview</label>
          <div class="grid two"><label>White key<input id="whiteColor" type="color" value="#eeeeee" /></label><label>Black key<input id="blackColor" type="color" value="#181818" /></label></div>
          <label>White roughness<div class="slider-number"><input type="range" data-sync="whiteRoughness" min="0" max="1" step="0.05" value="0.72" /><input id="whiteRoughness" type="number" min="0" max="1" step="0.05" value="0.72" /></div></label>
          <label>Black roughness<div class="slider-number"><input type="range" data-sync="blackRoughness" min="0" max="1" step="0.05" value="0.32" /><input id="blackRoughness" type="number" min="0" max="1" step="0.05" value="0.32" /></div></label>
        </details>

        <details open>
          <summary>Camera</summary>
          <label>Projection<select id="projection"><option value="orthographic">Orthographic</option><option value="perspective" selected>Perspective</option></select></label>
          <label>X<div class="slider-number"><input type="range" data-sync="cameraX" min="-800" max="800" step="5" value="0" /><input id="cameraX" type="number" step="5" value="0" /></div></label>
          <label>Y<div class="slider-number"><input type="range" data-sync="cameraY" min="-1000" max="400" step="0.01" value="-320.58" /><input id="cameraY" type="number" step="0.01" value="-320.58" /></div></label>
          <label>Z<div class="slider-number"><input type="range" data-sync="cameraZ" min="50" max="1400" step="0.01" value="498.54" /><input id="cameraZ" type="number" step="0.01" value="498.54" /></div></label>
          <label>Rot X<div class="slider-number"><input type="range" data-sync="cameraRotX" min="-90" max="90" step="1" value="-28" /><input id="cameraRotX" type="number" step="1" value="-28" /></div></label>
          <label>Rot Y<div class="slider-number"><input type="range" data-sync="cameraRotY" min="-90" max="90" step="1" value="0" /><input id="cameraRotY" type="number" step="1" value="0" /></div></label>
          <label>Rot Z<div class="slider-number"><input type="range" data-sync="cameraRotZ" min="-90" max="90" step="1" value="0" /><input id="cameraRotZ" type="number" step="1" value="0" /></div></label>
          <label>Zoom<div class="slider-number"><input type="range" data-sync="cameraZoom" min="0.1" max="5" step="0.05" value="1" /><input id="cameraZoom" type="number" min="0.1" max="20" step="0.05" value="1" /></div></label>
          <label>FOV<div class="slider-number"><input type="range" data-sync="cameraFov" min="10" max="100" step="1" value="35" /><input id="cameraFov" type="number" min="10" max="100" step="1" value="35" /></div></label>
          <button id="fitCamera" class="wide">Fit keyboard to frame</button>
        </details>

        <details><summary>Lighting</summary>
          <label>Ambient<div class="slider-number"><input type="range" data-sync="ambientIntensity" min="0" max="5" step="0.05" value="0" /><input id="ambientIntensity" type="number" min="0" max="5" step="0.05" value="0" /></div></label>
          <label>Main<div class="slider-number"><input type="range" data-sync="mainIntensity" min="0" max="10" step="0.05" value="6.6" /><input id="mainIntensity" type="number" min="0" max="10" step="0.05" value="6.6" /></div></label>
          <label>Light X<div class="slider-number"><input type="range" data-sync="lightX" min="-800" max="800" step="10" value="60" /><input id="lightX" type="number" step="10" value="60" /></div></label>
          <label>Light Y<div class="slider-number"><input type="range" data-sync="lightY" min="-800" max="800" step="10" value="-250" /><input id="lightY" type="number" step="10" value="-250" /></div></label>
          <label>Light Z<div class="slider-number"><input type="range" data-sync="lightZ" min="0" max="1200" step="10" value="500" /><input id="lightZ" type="number" step="10" value="500" /></div></label>
          <label class="check"><input id="shadows" type="checkbox" checked /> Shadows</label>
        </details>

        <details open><summary>Output</summary>
          <label>Width px<div class="slider-number"><input type="range" data-sync="outputWidth" min="64" max="2048" step="1" value="814" /><input id="outputWidth" type="number" min="32" max="8192" step="1" value="814" /></div></label>
          <label>Height px<div class="slider-number"><input type="range" data-sync="outputHeight" min="32" max="1024" step="1" value="212" /><input id="outputHeight" type="number" min="32" max="8192" step="1" value="212" /></div></label>
          <div class="grid two"><label>Scale<select id="outputScale"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option></select></label><label>Background<input id="backgroundColor" type="color" value="#d9d9d9" /></label></div>
          <label class="check"><input id="transparentBg" type="checkbox" checked /> Transparent background</label>
          <label class="check"><input id="cropIndividual" type="checkbox" /> Crop individual assets to bounds</label>
        </details>
      </aside>

      <section class="preview-column">
        <div class="panel preview-panel">
          <div class="preview-toolbar"><div><strong>Preview</strong><span id="rangeInfo">C2–C5</span></div><div class="preview-tools"><label>Pressed preview<select id="pressedNote"><option value="">None</option></select></label></div></div>
          <div id="viewport" class="viewport"></div>
          <div class="statusbar"><span id="keyCount">0 keys</span><span id="renderSize">814 × 212</span></div>
        </div>
        <div class="panel export-panel"><div><strong>Export</strong><p>Same camera, lighting and material settings are used for every generated asset.</p></div><div class="export-actions"><button id="exportKeyboard" class="primary">Keyboard PNG</button><button id="exportPressed" class="primary">Keyboard + pressed PNG</button><button id="exportKeys">Individual keys ZIP</button></div></div>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script type="module" src="./app.js?v=20260828-9"></script>
</body>
</html>
