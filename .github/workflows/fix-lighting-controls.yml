name: Fix lighting controls
on:
  push:
    paths:
      - '.github/workflows/fix-lighting-controls.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch lighting behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old="function updateSceneSettings(){const quality=$('renderQuality')?.value||'studio';ambient.intensity=n('ambientIntensity');mainLight.intensity=n('mainIntensity');mainLight.position.set(n('lightX'),n('lightY'),n('lightZ'));fillLight.intensity=quality==='asset'?0:quality==='product'?1.5:1.05;rimLight.intensity=quality==='asset'?0:quality==='product'?1.8:1.25;scene.environment=quality==='asset'?null:studioEnvironment;renderer.toneMappingExposure=quality==='product'?1.08:1;"
          new="function updateSceneSettings(){const quality=$('renderQuality')?.value||'studio',ambientLevel=Math.max(0,n('ambientIntensity')),ambientNorm=Math.min(1,ambientLevel/1.25);ambient.intensity=ambientLevel;mainLight.intensity=n('mainIntensity');mainLight.position.set(n('lightX'),n('lightY'),n('lightZ'));fillLight.intensity=quality==='asset'?0:(quality==='product'?1.35:.95)*ambientNorm;rimLight.intensity=quality==='asset'?0:(quality==='product'?1.55:1.05)*ambientNorm;scene.environment=quality==='asset'?null:studioEnvironment;if('environmentIntensity' in scene)scene.environmentIntensity=quality==='asset'?0:(quality==='product'?1.0:.72)*ambientNorm;renderer.toneMappingExposure=quality==='product'?1.04:1;"
          if old not in s: raise SystemExit('updateSceneSettings anchor not found')
          s=s.replace(old,new)
          s=s.replace("r.mesh.material.envMapIntensity=quality==='asset'?0:quality==='product'?1.15:.82;", "r.mesh.material.envMapIntensity=quality==='asset'?0:(quality==='product'?1.0:.72)*ambientNorm;")
          p.write_text(s)
          h=Path('index.html')
          hs=h.read_text().replace('20260828-11','20260828-12').replace('20260828-10','20260828-12')
          h.write_text(hs)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js index.html
          git commit -m 'Make ambient control studio environment lighting' || exit 0
          git push
