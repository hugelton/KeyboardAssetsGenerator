name: Studio render patch
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/studio-render.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch realistic rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js'); s=p.read_text()

          if "RoomEnvironment" not in s:
              s=s.replace("import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';", "import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';\nimport { RoomEnvironment } from 'https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/environments/RoomEnvironment.js';")

          s=s.replace("'sizePreset','wireframe','whiteWidth'", "'sizePreset','wireframe','renderQuality','whiteWidth'")
          s=s.replace("'sizePreset','sizePreset','wireframe','whiteWidth'", "'sizePreset','wireframe','renderQuality','whiteWidth'")
          s=s.replace("'sizePreset','wireframe','whiteWidth'", "'sizePreset','wireframe','renderQuality','whiteWidth'")

          anchor="viewport.appendChild(renderer.domElement);"
          if "RoomEnvironment(renderer)" not in s:
              s=s.replace(anchor, anchor+"\nconst pmremGenerator=new THREE.PMREMGenerator(renderer);\nconst studioEnvironment=pmremGenerator.fromScene(new RoomEnvironment(renderer),0.04).texture;\nscene.environment=studioEnvironment;")

          old="const ambient=new THREE.AmbientLight(0xffffff,1.25);scene.add(ambient);\nconst mainLight=new THREE.DirectionalLight(0xffffff,3);mainLight.position.set(-250,-250,500);mainLight.castShadow=true;mainLight.shadow.mapSize.set(2048,2048);mainLight.shadow.bias=-.0002;scene.add(mainLight);"
          new="const ambient=new THREE.AmbientLight(0xffffff,0);scene.add(ambient);\nconst mainLight=new THREE.DirectionalLight(0xffffff,6.6);mainLight.position.set(60,-250,500);mainLight.castShadow=true;mainLight.shadow.mapSize.set(2048,2048);mainLight.shadow.bias=-.00015;mainLight.shadow.radius=2;scene.add(mainLight);\nconst fillLight=new THREE.DirectionalLight(0xdde7ff,1.15);fillLight.position.set(-340,120,220);scene.add(fillLight);\nconst rimLight=new THREE.DirectionalLight(0xfff1dc,1.4);rimLight.position.set(280,180,360);scene.add(rimLight);"
          if old in s: s=s.replace(old,new)

          oldmat="function keyMaterial(color,roughness){return new THREE.MeshStandardMaterial({color:new THREE.Color(color),roughness,metalness:.02,wireframe:b('wireframe')})}"
          newmat="function keyMaterial(color,roughness,kind='white'){const quality=$('renderQuality')?.value||'studio',wireframe=b('wireframe');if(quality==='asset')return new THREE.MeshStandardMaterial({color:new THREE.Color(color),roughness,metalness:.01,wireframe});const isBlack=kind==='black';return new THREE.MeshPhysicalMaterial({color:new THREE.Color(color),roughness:isBlack?Math.min(roughness,.38):Math.max(roughness,.42),metalness:0,clearcoat:quality==='product'?(isBlack?.72:.42):(isBlack?.52:.28),clearcoatRoughness:isBlack?.18:.34,ior:1.48,specularIntensity:isBlack?.8:.46,envMapIntensity:quality==='product'?1.45:1.05,wireframe})}"
          if oldmat in s: s=s.replace(oldmat,newmat)
          s=s.replace("keyMaterial($('whiteColor').value,n('whiteRoughness'))", "keyMaterial($('whiteColor').value,n('whiteRoughness'),'white')")

          import re
          s=re.sub(r"new THREE\.MeshStandardMaterial\(\{color:new THREE\.Color\(\$\('blackColor'\)\.value\),roughness:n\('blackRoughness'\),metalness:\.02,flatShading:true,wireframe:b\('wireframe'\)\}\)", "keyMaterial($('blackColor').value,n('blackRoughness'),'black')", s)
          s=s.replace("const pivot=new THREE.Group();pivot.position.x=boundaryX", "mesh.material.flatShading=true;mesh.material.needsUpdate=true;const pivot=new THREE.Group();pivot.position.x=boundaryX")

          oldscene="function updateSceneSettings(){ambient.intensity=n('ambientIntensity');mainLight.intensity=n('mainIntensity');mainLight.position.set(n('lightX'),n('lightY'),n('lightZ'));renderer.shadowMap.enabled=b('shadows');mainLight.castShadow=b('shadows');const transparent=b('transparentBg');"
          newscene="function updateSceneSettings(){const quality=$('renderQuality')?.value||'studio';ambient.intensity=n('ambientIntensity');mainLight.intensity=n('mainIntensity');mainLight.position.set(n('lightX'),n('lightY'),n('lightZ'));fillLight.intensity=quality==='asset'?0:quality==='product'?1.5:1.05;rimLight.intensity=quality==='asset'?0:quality==='product'?1.8:1.25;scene.environment=quality==='asset'?null:studioEnvironment;renderer.toneMappingExposure=quality==='product'?1.08:1;renderer.shadowMap.enabled=b('shadows');renderer.shadowMap.type=THREE.PCFSoftShadowMap;mainLight.castShadow=b('shadows');mainLight.shadow.mapSize.set(quality==='product'?4096:2048,quality==='product'?4096:2048);mainLight.shadow.radius=quality==='product'?4:2;keyRecords.forEach(r=>{if(r.mesh?.material){r.mesh.material.envMapIntensity=quality==='asset'?0:quality==='product'?1.45:1.05;r.mesh.material.needsUpdate=true}});const transparent=b('transparentBg');"
          if oldscene in s: s=s.replace(oldscene,newscene)

          # Size presets: keep existing Piano and add compact keyboard families.
          if "const SIZE_PRESETS" not in s:
              insert="const SIZE_PRESETS={piano:{whiteWidth:48,whiteLength:318,blackWidth:21.7,blackRootWidth:21.7,blackLength:202},cz101:{whiteWidth:48,whiteLength:223.14,blackWidth:19.46,blackRootWidth:22.05,blackLength:124.54},microkorg:{whiteWidth:48,whiteLength:219.43,blackWidth:18.51,blackRootWidth:18.51,blackLength:123.43}};\n"
              s=s.replace("const OUTPUT_IDS=new Set(['outputWidth','outputHeight']);", "const OUTPUT_IDS=new Set(['outputWidth','outputHeight']);\n"+insert)

          if "function applySizePreset" not in s:
              marker="function queueRebuild()"
              fn="function applySizePreset(){const preset=SIZE_PRESETS[$('sizePreset')?.value];if(!preset)return;for(const [id,value] of Object.entries(preset)){const el=$(id);if(el)el.value=value}syncAllControls();queueRebuild();setTimeout(fitCamera,0)}\n"
              s=s.replace(marker,fn+marker)
              s=s.replace("wireControls();syncAllControls();", "wireControls();syncAllControls();\nif($('sizePreset'))$('sizePreset').addEventListener('change',applySizePreset);")

          p.write_text(s)

          p=Path('index.html'); h=p.read_text()
          h=h.replace('<option value="piano">Piano standard</option>', '<option value="piano">Piano standard</option><option value="cz101">CZ-101 mini</option><option value="microkorg">microKORG mini</option>')
          if 'id="renderQuality"' not in h:
              h=h.replace('<summary>Materials</summary>', '<summary>Materials</summary>\n          <label>Render quality<select id="renderQuality"><option value="asset">Asset</option><option value="studio" selected>Studio</option><option value="product">Product</option></select></label>')
          h=h.replace('v=20260828-7','v=20260828-9').replace('v=20260828-8','v=20260828-9')
          p.write_text(h)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js index.html
          git commit -m 'Add studio and product rendering modes' || exit 0
          git push
