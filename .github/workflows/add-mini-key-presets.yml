name: Add mini key presets
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/add-mini-key-presets.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch presets and black-key root width
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # index.html
          p=Path('index.html'); s=p.read_text()
          s=s.replace(
            '<label>Size preset<select id="sizePreset"><option value="custom">Custom</option><option value="piano">Piano standard</option></select></label>',
            '<label>Size preset<select id="sizePreset"><option value="custom">Custom</option><option value="piano">Piano standard</option><option value="cz101">CZ-101 mini keys</option><option value="microkorg">microKORG mini keys</option></select></label>'
          )
          needle='<label>Black width<div class="slider-number"><input type="range" data-sync="blackWidth" min="6" max="60" step="1" value="23" /><input id="blackWidth" type="number" min="4" max="120" step="1" value="23" /></div></label>'
          repl=needle+'\n          <label>Black root width<div class="slider-number"><input type="range" data-sync="blackBaseWidth" min="4" max="60" step="0.25" value="23" /><input id="blackBaseWidth" type="number" min="4" max="120" step="0.25" value="23" /></div></label>'
          if 'id="blackBaseWidth"' not in s:
              assert needle in s, 'black width field not found'
              s=s.replace(needle,repl)
          s=re.sub(r'v=20260828-\d+', 'v=20260828-8', s)
          p.write_text(s)

          # app.js
          p=Path('app.js'); s=p.read_text()
          s=s.replace("'blackWidth','blackLength'", "'blackWidth','blackBaseWidth','blackLength'")
          s=s.replace("'blackWidth','blackLength'", "'blackWidth','blackBaseWidth','blackLength'")
          # White-key rear cutout follows the wider root of tapered black keys.
          s=s.replace("n('blackWidth')/2+gap/2", "Math.max(n('blackWidth'),n('blackBaseWidth'))/2+gap/2")
          s=s.replace("x1-n('blackWidth')/2-gap/2", "x1-Math.max(n('blackWidth'),n('blackBaseWidth'))/2-gap/2")

          old=re.search(r"function blackKeyGeometry\(w,len,h,gap\)\{.*?return geo\}",s)
          assert old, 'blackKeyGeometry not found'
          new="""function blackKeyGeometry(w,baseW,len,h,gap){const frontWidth=Math.max(2,w-Math.min(gap,w/6)),rearWidth=Math.max(frontWidth,baseW-Math.min(gap,baseW/6)),frontHalf=frontWidth/2,rearHalf=rearWidth/2,rearY=0,frontY=-len,nose=Math.min(16,Math.max(8,len*.16)),noseY=frontY+nose,zFront=Math.max(h*.16,1.5);const sections=[{y:rearY,z:h,half:rearHalf},{y:noseY,z:h,half:frontHalf},{y:frontY,z:zFront,half:frontHalf}],verts=[];for(const q of sections)verts.push(-q.half,q.y,0,q.half,q.y,0,-q.half,q.y,q.z,q.half,q.y,q.z);const idx=[];for(let i=0;i<sections.length-1;i++){const a=i*4,c=(i+1)*4;idx.push(a,c,c+1,a,c+1,a+1,a+2,a+3,c+3,a+2,c+3,c+2,a,a+2,c+2,a,c+2,c,a+1,c+1,c+3,a+1,c+3,a+3)}idx.push(0,1,3,0,3,2);const f=(sections.length-1)*4;idx.push(f,f+2,f+3,f,f+3,f+1);let geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(idx);geo=geo.toNonIndexed();geo.computeVertexNormals();return geo}"""
          s=s[:old.start()]+new+s[old.end():]
          s=s.replace("const w=n('blackWidth'),len=n('blackLength'),h=n('blackHeight'),gap=n('keyGap'),geo=blackKeyGeometry(w,len,h,gap)", "const w=n('blackWidth'),baseW=n('blackBaseWidth'),len=n('blackLength'),h=n('blackHeight'),gap=n('keyGap'),geo=blackKeyGeometry(w,baseW,len,h,gap)")

          marker="wireControls();syncAllControls();"
          assert marker in s, 'wireControls marker not found'
          preset_code="""
const SIZE_PRESETS={
  piano:{whiteWidth:22.65,whiteLength:150,blackWidth:10.25,blackBaseWidth:10.25,blackLength:95},
  cz101:{whiteWidth:18.5,whiteLength:86,blackWidth:7.5,blackBaseWidth:8.5,blackLength:48},
  microkorg:{whiteWidth:17.5,whiteLength:80,blackWidth:6.75,blackBaseWidth:6.75,blackLength:45}
};
function applySizePreset(name){const preset=SIZE_PRESETS[name];if(!preset)return;for(const [id,value] of Object.entries(preset)){const el=$(id);if(el)el.value=String(value)}syncAllControls();queueRebuild();setTimeout(fitCamera,0)}
"""
          if 'const SIZE_PRESETS=' not in s:
              s=s.replace(marker,preset_code+'\n'+marker)
          listener="$('sizePreset').addEventListener('change',()=>applySizePreset($('sizePreset').value));"
          if listener not in s:
              s=s.replace("$('pressedNote').addEventListener('change',applyPressedPreview);", listener+"\n$('pressedNote').addEventListener('change',applyPressedPreview);")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html app.js
          git commit -m 'Add CZ-101 and microKORG keyboard size presets' || exit 0
          git push
