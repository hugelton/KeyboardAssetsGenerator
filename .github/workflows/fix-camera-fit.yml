name: Fix camera fit
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fix-camera-fit.yml']
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Sharpen black key profile and normals
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old="function blackKeyGeometry(w,len,h,gap){const width=Math.max(2,w-Math.min(gap,w/6)),half=width/2,rearY=0,frontY=-len,nose=Math.min(14,Math.max(7,len*.15)),y1=frontY+nose,y2=frontY+nose*.42,zFront=Math.max(h*.18,1.5);const sections=[{y:rearY,z:h},{y:y1,z:h},{y:y2,z:h*.88},{y:frontY,z:zFront}],verts=[];for(const s of sections)verts.push(-half,s.y,0,half,s.y,0,-half,s.y,s.z,half,s.y,s.z);const idx=[];for(let i=0;i<sections.length-1;i++){const a=i*4,c=(i+1)*4;idx.push(a,c,c+1,a,c+1,a+1,a+2,a+3,c+3,a+2,c+3,c+2,a,a+2,c+2,a,c+2,c,a+1,c+1,c+3,a+1,c+3,a+3)}idx.push(0,1,3,0,3,2);const f=(sections.length-1)*4;idx.push(f,f+2,f+3,f,f+3,f+1);const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(idx);geo.computeVertexNormals();return geo}"
          new="function blackKeyGeometry(w,len,h,gap){const width=Math.max(2,w-Math.min(gap,w/6)),half=width/2,rearY=0,frontY=-len,nose=Math.min(16,Math.max(8,len*.16)),noseY=frontY+nose,zFront=Math.max(h*.16,1.5);const sections=[{y:rearY,z:h},{y:noseY,z:h},{y:frontY,z:zFront}],verts=[];for(const s of sections)verts.push(-half,s.y,0,half,s.y,0,-half,s.y,s.z,half,s.y,s.z);const idx=[];for(let i=0;i<sections.length-1;i++){const a=i*4,c=(i+1)*4;idx.push(a,c,c+1,a,c+1,a+1,a+2,a+3,c+3,a+2,c+3,c+2,a,a+2,c+2,a,c+2,c,a+1,c+1,c+3,a+1,c+3,a+3)}idx.push(0,1,3,0,3,2);const f=(sections.length-1)*4;idx.push(f,f+2,f+3,f,f+3,f+1);let geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(idx);geo=geo.toNonIndexed();geo.computeVertexNormals();return geo}"
          assert old in s, 'blackKeyGeometry pattern not found'
          s=s.replace(old,new)
          old2="mesh=new THREE.Mesh(geo,keyMaterial($('blackColor').value,n('blackRoughness')))"
          new2="mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:new THREE.Color($('blackColor').value),roughness:n('blackRoughness'),metalness:.02,flatShading:true}))"
          assert old2 in s, 'black material pattern not found'
          p.write_text(s.replace(old2,new2))
          PY
      - name: Bust browser cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); s=s.replace('v=20260828-5','v=20260828-6'); p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js index.html
          git commit -m 'Make black key edges crisp with flat normals' || exit 0
          git push
