name: UI preset and wireframe patch
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/ui-preset-wireframe.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch app and UI
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<summary>Key geometry</summary>', '''<summary>Key geometry</summary>
          <label>Size preset<select id="sizePreset"><option value="custom">Custom</option><option value="piano">Piano standard</option></select></label>''')
          s=s.replace('<summary>Materials</summary>', '<summary>Materials</summary>\n          <label class="check"><input id="wireframe" type="checkbox" /> Wireframe preview</label>')
          replacements={
            'id="cameraY" type="number" step="5" value="-260"':'id="cameraY" type="number" step="0.01" value="-320.58"',
            'data-sync="cameraY" min="-1000" max="400" step="5" value="-260"':'data-sync="cameraY" min="-1000" max="400" step="0.01" value="-320.58"',
            'id="cameraZ" type="number" step="5" value="430"':'id="cameraZ" type="number" step="0.01" value="498.54"',
            'data-sync="cameraZ" min="50" max="1400" step="5" value="430"':'data-sync="cameraZ" min="50" max="1400" step="0.01" value="498.54"',
            'id="cameraRotX" type="number" step="1" value="-20"':'id="cameraRotX" type="number" step="1" value="-28"',
            'data-sync="cameraRotX" min="-90" max="90" step="1" value="-20"':'data-sync="cameraRotX" min="-90" max="90" step="1" value="-28"',
            'data-sync="ambientIntensity" min="0" max="5" step="0.05" value="1.25"':'data-sync="ambientIntensity" min="0" max="5" step="0.05" value="0"',
            'id="ambientIntensity" type="number" min="0" max="5" step="0.05" value="1.25"':'id="ambientIntensity" type="number" min="0" max="5" step="0.05" value="0"',
            'data-sync="mainIntensity" min="0" max="10" step="0.05" value="3"':'data-sync="mainIntensity" min="0" max="10" step="0.05" value="6.6"',
            'id="mainIntensity" type="number" min="0" max="10" step="0.05" value="3"':'id="mainIntensity" type="number" min="0" max="10" step="0.05" value="6.6"',
            'data-sync="lightX" min="-800" max="800" step="10" value="-250"':'data-sync="lightX" min="-800" max="800" step="10" value="60"',
            'id="lightX" type="number" step="10" value="-250"':'id="lightX" type="number" step="10" value="60"',
            'src="./app.js?v=20260828-4"':'src="./app.js?v=20260828-7"',
            'styles.css?v=20260828-6':'styles.css?v=20260828-7'
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          p.write_text(s)

          p=Path('app.js')
          s=p.read_text()
          s=s.replace("'rangeFrom','rangeTo','showLabels'", "'rangeFrom','rangeTo','showLabels','sizePreset','wireframe'")
          s=s.replace("const GEOMETRY_IDS=new Set(['rangeFrom','rangeTo','showLabels'", "const GEOMETRY_IDS=new Set(['rangeFrom','rangeTo','showLabels','sizePreset'")
          s=s.replace("function keyMaterial(color,roughness){return new THREE.MeshStandardMaterial({color:new THREE.Color(color),roughness,metalness:.02})}", "function keyMaterial(color,roughness){return new THREE.MeshStandardMaterial({color:new THREE.Color(color),roughness,metalness:.02,wireframe:b('wireframe')})}")
          s=s.replace("new THREE.MeshStandardMaterial({color:new THREE.Color($('blackColor').value),roughness:n('blackRoughness'),metalness:.02,flatShading:true})", "new THREE.MeshStandardMaterial({color:new THREE.Color($('blackColor').value),roughness:n('blackRoughness'),metalness:.02,flatShading:true,wireframe:b('wireframe')})")
          s=s.replace("function handleConfigChange(id){if(GEOMETRY_IDS.has(id))queueRebuild();", "function applySizePreset(){if($('sizePreset').value==='piano'){const scale=48/22.65;$('whiteWidth').value=(22.65*scale).toFixed(2);$('whiteLength').value=(150*scale).toFixed(2);$('blackWidth').value=(10.25*scale).toFixed(2);$('blackLength').value=(95*scale).toFixed(2);syncAllControls()}}\nfunction handleConfigChange(id){if(id==='sizePreset'){applySizePreset();queueRebuild();}else if(id==='wireframe')queueRebuild();else if(GEOMETRY_IDS.has(id))queueRebuild();")
          s=s.replace("applyConfig({projection:'perspective',cameraX:'0',cameraY:String(-Math.round(n('whiteLength')*1.55)),cameraZ:'430',cameraRotX:'-20'", "applyConfig({projection:'perspective',cameraX:'0',cameraY:'-320.58',cameraZ:'498.54',cameraRotX:'-28'")
          s=s.replace("ambientIntensity:'1.25',mainIntensity:'3',lightX:'-250'", "ambientIntensity:'0',mainIntensity:'6.6',lightX:'60'")
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js index.html
          git commit -m 'Add piano size preset wireframe and new defaults' || exit 0
          git push
