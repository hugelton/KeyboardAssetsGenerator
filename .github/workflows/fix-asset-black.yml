name: Fix Asset render mode
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Asset material
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old="if(quality==='asset')return new THREE.MeshStandardMaterial({color:new THREE.Color(color),roughness,metalness:.01,wireframe});"
          new="if(quality==='asset')return new THREE.MeshBasicMaterial({color:new THREE.Color(color),wireframe,toneMapped:false});"
          if old not in s:
              raise SystemExit('asset material anchor not found')
          s=s.replace(old,new)
          p.write_text(s)
          h=Path('index.html')
          hs=h.read_text().replace('20260828-12','20260828-13').replace('20260828-11','20260828-13').replace('20260828-10','20260828-13')
          h.write_text(hs)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js index.html
          git commit -m 'Use unlit materials for Asset mode'
          git push